<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨页 · Markdown 编辑器</title><style>
:root{color-scheme:light;--bg:#f5f6f8;--paper:#fff;--ink:#242833;--muted:#7b8290;--line:#e6e8ed;--accent:#5264df;--soft:#eef0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button{border:0;background:transparent;color:inherit;border-radius:7px;padding:7px 12px}button:hover{background:var(--soft);color:var(--accent)}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{height:76px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:650;font-size:20px;letter-spacing:1px}.logo{background:var(--ink);color:var(--paper);border-radius:9px;width:34px;height:34px;text-align:center;font:700 23px/34px Georgia}.brand small{font-size:11px;letter-spacing:2px;font-weight:400;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.primary{background:var(--accent);color:white;padding:8px 17px}.primary:hover{background:#4253c8;color:white}.workspace{display:grid;grid-template-columns:236px 1fr;height:calc(100dvh - 108px)}aside{padding:28px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}.eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--muted);margin:0 10px 12px}.file{background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:9px;display:flex;align-items:center;gap:10px}.file-icon{color:var(--accent);font-family:monospace;font-weight:bold}.file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.outline{overflow:auto;flex:1}.outline button{display:block;text-align:left;width:100%;font-size:14px;color:var(--muted);margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.outline button:first-child{color:var(--accent);background:var(--soft)}.aside-foot{font-size:12px;color:var(--muted);padding:12px 8px;border-top:1px solid var(--line)}main{min-width:0;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;gap:15px}.breadcrumb{color:var(--muted);font-size:13px}.breadcrumb strong{color:var(--ink);font-weight:500}.modes{display:flex;gap:3px;border:1px solid var(--line);background:var(--paper);padding:3px;border-radius:9px}.modes button{font-size:13px;padding:5px 15px}.modes button.active{background:var(--soft);color:var(--accent)}.toolbar{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin:0 32px;padding:10px 15px;background:var(--paper);border:1px solid var(--line);border-radius:10px 10px 0 0}.toolbar button{min-width:34px;padding:5px 8px;line-height:24px}.separator{height:20px;width:1px;background:var(--line);margin:0 6px}.toolbar select{border:0;background:var(--paper);color:var(--ink);font-size:14px;width:94px;padding:5px}.toolbar .end{margin-left:auto;font-size:12px;color:var(--muted)}.canvas{overflow:auto;margin:0 32px 20px;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;flex:1;box-shadow:0 6px 20px #17203c03}.paper-head{max-width:860px;margin:auto;padding:42px 58px 0;display:flex;gap:9px;align-items:center;color:var(--muted);font-size:11px;letter-spacing:1.7px}.dot{width:6px;height:6px;background:#6aaf88;border-radius:100%}.prose{outline:none;max-width:860px;min-height:65vh;padding:12px 58px 80px;margin:auto;font-size:16px;line-height:1.9;overflow-wrap:anywhere}.prose h1{font-size:36px;line-height:1.35;letter-spacing:-1px;margin:12px 0 24px;font-weight:650}.prose h2{font-size:23px;line-height:1.5;margin:34px 0 16px;font-weight:600}.prose h3{font-size:19px;margin:26px 0 12px}.prose p{margin:13px 0}.prose a{color:var(--accent);text-underline-offset:4px}.prose blockquote{border-left:3px solid var(--accent);background:var(--soft);padding:12px 22px;margin:24px 0;color:#58628b;border-radius:0 7px 7px 0}.prose blockquote p{margin:0}.prose code{font:14px/1.8 Consolas,monospace;background:var(--bg);padding:3px 6px;border-radius:4px;color:#b15270}.prose pre{background:#202534;color:#d9e2f4;padding:20px 24px;border-radius:9px;overflow:auto}.prose pre code{color:inherit;background:none;padding:0}.prose table{width:100%;border-collapse:collapse;font-size:14px;margin:22px 0}.prose td,.prose th{border:1px solid var(--line);padding:10px 15px;text-align:left}.prose th{background:var(--bg);font-weight:600}.prose hr{border:0;border-top:1px solid var(--line);margin:32px 0}.prose img{max-width:100%;border-radius:8px}.prose li{padding-left:5px}.prose input[type=checkbox]{accent-color:var(--accent);margin-right:8px}.source{display:none;width:100%;min-height:100%;resize:none;border:0;background:var(--paper);color:var(--ink);padding:40px;font:15px/1.9 Consolas,monospace;outline:0}.status{height:32px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;color:var(--muted)}.status-left{display:flex;gap:22px}.toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 20px;border-radius:9px;box-shadow:0 5px 20px #0002;display:none;z-index:20}dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:28px;width:400px;max-width:90vw;box-shadow:0 20px 80px #0002}dialog::backdrop{background:#151b3640}dialog h3{margin:0 0 20px}dialog label{display:block;font-size:14px;margin:14px 0 5px}dialog input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}dialog .actions{justify-content:flex-end;margin-top:24px}body.dark{color-scheme:dark;--bg:#171a21;--paper:#20242d;--ink:#e5e8ef;--muted:#969eaf;--line:#343945;--accent:#98a3ff;--soft:#30364f}body.dark .prose blockquote{color:#b2bde8}body.focus .workspace{grid-template-columns:1fr}body.focus aside{display:none}body.focus .prose{max-width:880px}@media(max-width:900px){.workspace{grid-template-columns:185px 1fr}aside{padding:25px 12px}.topbar{padding:16px}.toolbar{margin:0 16px}.canvas{margin:0 16px 16px}.prose{padding:12px 30px 60px}.paper-head{padding:30px 30px 0}.breadcrumb{display:none}.topbar{justify-content:center}}@media(max-width:620px){header{padding:0 14px;height:66px}.brand small{display:none}.brand{font-size:18px}.actions{gap:2px}.actions button{padding:6px 9px;font-size:13px}.workspace{height:calc(100dvh - 98px);grid-template-columns:1fr}aside{display:none}.toolbar{margin:0 8px;padding:8px}.canvas{margin:0 8px 8px}.toolbar .end{display:none}.prose{padding:8px 23px 40px}.prose h1{font-size:29px}.paper-head{padding:25px 23px 0}.status{padding:0 12px}.status-left{gap:12px}}
</style></head><body>
<header><div class="brand" aria-label="Markdown 编辑器"><span class="logo">MD</span></div><div class="actions"><button id="open">↗ 打开文件</button><button id="theme" aria-label="切换深浅主题" title="切换深浅主题">◐</button><button id="export" class="primary">导出 .md ↓</button></div></header>
<div class="workspace"><aside><section class="current-document"><p class="eyebrow">当前文档</p><div class="file"><span class="file-icon">M↓</span><span id="filename">写作，从这里开始.md</span></div></section><section class="outline"><p class="eyebrow">文档大纲</p><nav id="outline"></nav></section><div class="aside-foot">让思绪流动，让文字成形。<br>文件在本地读取与编辑</div></aside><main><div class="topbar"><div class="breadcrumb">我的文档 <span style="margin:0 12px">/</span> <strong id="crumb">写作，从这里开始</strong></div><div class="modes" role="tablist" aria-label="编辑模式"><button role="tab" aria-selected="true" class="active" data-mode="visual">可视化</button><button role="tab" aria-selected="false" data-mode="source">源码</button><button role="tab" aria-selected="false" data-mode="read">阅读</button></div><button id="focus" title="专注模式" aria-label="切换专注模式">⛶</button></div>
<div class="toolbar" id="toolbar"><select id="block" aria-label="段落样式"><option value="p">正文</option><option value="h1">标题 1</option><option value="h2">标题 2</option><option value="h3">标题 3</option><option value="h4">标题 4</option><option value="h5">标题 5</option><option value="h6">标题 6</option></select><span class="separator"></span><button data-cmd="bold" title="粗体 Ctrl+B"><b>B</b></button><button data-cmd="italic" title="斜体 Ctrl+I"><i>I</i></button><button data-cmd="strikeThrough" title="删除线"><s>S</s></button><button data-insert="inline" title="行内代码">‹/›</button><span class="separator"></span><button data-cmd="insertUnorderedList" title="无序列表">☷</button><button data-cmd="insertOrderedList" title="有序列表">≡₁</button><button data-insert="task" title="任务列表">☑</button><button data-insert="quote" title="引用">❞</button><span class="separator"></span><button data-insert="link" title="插入链接">↗</button><button data-insert="image" title="插入图片链接">▧</button><button data-insert="table" title="插入表格">▦</button><button data-insert="code" title="代码块">{ }</button><button data-insert="hr" title="分隔线">—</button><button data-cmd="undo" title="撤销">↶</button><button data-cmd="redo" title="重做">↷</button><span class="end">MARKDOWN</span></div>
<div class="canvas" id="canvas"><div class="paper-head" id="paperHead"><span class="dot"></span><span id="paperLabel">可视化编辑 · 点击文字开始写作</span></div><article class="prose" id="editor" contenteditable="true" role="textbox" aria-label="Markdown 可视化编辑区" aria-multiline="true" spellcheck="false"></article><textarea class="source" id="source" aria-label="Markdown 源码" spellcheck="false"></textarea></div></main></div>
<footer class="status"><div class="status-left"><span id="saveState">● 本地草稿</span><span id="count"></span></div><span>Markdown <span style="margin:0 10px">·</span> UTF-8</span></footer><div class="toast" id="toast" role="status"></div><input type="file" id="fileInput" accept=".md,.markdown,.txt,text/plain" hidden><dialog id="dialog"><form id="form"><h3 id="dialogTitle">插入链接</h3><label for="label">显示文字</label><input id="label" autocomplete="off"><label for="url">链接地址</label><input id="url" type="url" required placeholder="https://"><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">插入</button></div></form></dialog>
<script>/*MARKED_LIBRARY*/</script><script>
const $=id=>document.getElementById(id),editor=$('editor'),source=$('source');let mode='visual',filename='写作，从这里开始.md',range=null,insertType='link',saveTimer;
const initial='# 写作，从这里开始\n\n好的工具，让你专注于想法本身。欢迎来到 **墨页**，一处安静、轻盈的 Markdown 写作空间。\n\n> 不必记住每一个语法。选中文字，轻点工具栏，让表达自然发生。\n\n## 01 · 把想法变成文字\n\n你可以直接在这里编辑，使用 **粗体** 突出重点、*斜体* 表达语气，或用 ~~删除线~~ 记录想法的变化。`行内代码` 也有自己的位置。\n\n- 用标题梳理内容的层次\n- 用列表组织零散的灵感\n- 在「源码」与「可视化」之间自由切换\n\n## 02 · 有条理，也有表达力\n\n| 内容样式 | 适合用来 |\n| --- | --- |\n| 引用段落 | 留下一句话，或一个值得记住的观点 |\n| 任务清单 | 把下一步，变得更清晰 |\n| 代码片段 | 分享实现思路与技术细节 |\n\n### 今日写作清单\n\n- [x] 找到一个想写的话题\n- [ ] 写下第一段，不急着修改\n- [ ] 整理后，导出为 Markdown 文件\n\n## 03 · 给灵感一点空间\n\n```javascript\nconst idea = "从一个小小的想法开始";\nconsole.log(idea);\n```\n\n---\n\n现在，试着写下属于你的第一句话。\n';let md=initial;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function safeURL(url,image=false){return /^(https?:|mailto:)/i.test(url)||(!image&&/^#/.test(url))||(image&&/^data:image\/(?:png|jpe?g|gif|webp|bmp);base64,[a-z0-9+/=\s]+$/i.test(url))}
function render(){const doc=new DOMParser().parseFromString(marked.parse(md,{gfm:true,breaks:false}),'text/html');const allowed=new Set('P DIV SPAN H1 H2 H3 H4 H5 H6 STRONG B EM I DEL S BLOCKQUOTE UL OL LI PRE CODE TABLE THEAD TBODY TR TH TD HR BR A IMG INPUT'.split(' '));for(const el of [...doc.body.querySelectorAll('*')]){if(!allowed.has(el.tagName)){el.remove();continue}for(const a of [...el.attributes]){if(!['href','src','alt','title','type','checked','start','align','class'].includes(a.name))el.removeAttribute(a.name)}if(el.tagName==='A'){if(!safeURL(el.getAttribute('href')||''))el.removeAttribute('href');el.setAttribute('rel','noopener noreferrer');el.setAttribute('target','_blank')}if(el.tagName==='IMG'&&!safeURL(el.getAttribute('src')||'',true))el.removeAttribute('src');if(el.tagName==='INPUT'){el.type='checkbox';el.contentEditable='false';el.disabled=false}}editor.innerHTML=doc.body.innerHTML;updateMeta()}
function escapeText(t){return t.replace(/\\/g,'\\\\').replace(/([*_`\[\]~])/g,'\\$1')}
function serialize(node,inTable=false){if(node.nodeType===3)return escapeText(node.textContent);if(node.nodeType!==1)return '';const tag=node.tagName,c=()=>[...node.childNodes].map(n=>serialize(n,inTable)).join('');if(/^H[1-6]$/.test(tag))return '\n\n'+'#'.repeat(+tag[1])+' '+c().trim()+'\n\n';switch(tag){case 'BR':return inTable?' ':'  \n';case 'P':case 'DIV':return '\n\n'+c().trim()+'\n\n';case 'STRONG':case 'B':return '**'+c()+'**';case 'EM':case 'I':return '*'+c()+'*';case 'DEL':case 'S':return '~~'+c()+'~~';case 'PRE':{const text=node.textContent.replace(/\n$/,'');const ticks=Math.max(3,...(text.match(/`+/g)||[]).map(x=>x.length+1));return '\n\n'+'`'.repeat(ticks)+'\n'+text+'\n'+'`'.repeat(ticks)+'\n\n'}case 'CODE':{const ticks='`'.repeat(Math.max(1,...(node.textContent.match(/`+/g)||[]).map(x=>x.length+1)));return ticks+' '+node.textContent+' '+ticks}case 'BLOCKQUOTE':return '\n\n'+c().trim().split('\n').map(l=>'> '+l).join('\n')+'\n\n';case 'UL':case 'OL':return '\n\n'+[...node.children].map((li,i)=>{const marker=tag==='OL'?String((+node.getAttribute('start')||1)+i)+'. ':'- ';return marker+serialize(li).trim().replace(/\n/g,'\n'+' '.repeat(marker.length))}).join('\n')+'\n\n';case 'LI':return c();case 'INPUT':return node.checked?'[x] ':'[ ] ';case 'A':return '['+c()+']('+encodeURI(node.getAttribute('href')||'').replace(/\(/g,'%28').replace(/\)/g,'%29')+')';case 'IMG':return '!['+escapeText(node.alt)+']('+(node.getAttribute('src')||'').replace(/\(/g,'%28').replace(/\)/g,'%29')+')';case 'HR':return '\n\n---\n\n';case 'TABLE':{const rows=[...node.rows].map(r=>'| '+[...r.cells].map(cell=>[...cell.childNodes].map(n=>serialize(n,true)).join('').trim().replace(/\n+/g,' ').replace(/\|/g,'\\|')).join(' | ')+' |');if(rows.length)rows.splice(1,0,'| '+[...node.rows[0].cells].map(()=> '---').join(' | ')+' |');return '\n\n'+rows.join('\n')+'\n\n'}default:return c()}}
function sync(){md=[...editor.childNodes].map(n=>serialize(n)).join('').trim()+'\n';source.value=md;changed()}
function changed(){updateMeta();$('saveState').textContent='● 正在保存';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem('moye-draft',JSON.stringify({md,filename}));$('saveState').textContent='● 已保存到本机'}catch{$('saveState').textContent='● 未保存，请导出文件'}},400)}
function updateMeta(){const countNode=$('count'),filenameNode=$('filename'),crumbNode=$('crumb');if(countNode)countNode.textContent=md.replace(/\s/g,'').length+' 字符';if(filenameNode)filenameNode.textContent=filename;if(crumbNode)crumbNode.textContent=filename.replace(/\.(md|markdown|txt)$/i,'');const nav=$('outline');if(!nav)return;nav.replaceChildren();const headings=mode==='source'?[...md.matchAll(/^(#{1,6})\s+(.+)$/gm)].map(m=>({textContent:m[2],tagName:'H'+m[1].length})): [...editor.querySelectorAll('h1,h2,h3,h4,h5,h6')];headings.forEach((h,i)=>{const b=document.createElement('button');b.textContent=h.textContent;b.style.paddingLeft=(10+(+h.tagName[1]-1)*10)+'px';b.onclick=()=>{if(mode==='source'){const matches=[...md.matchAll(/^(#{1,6})\s+(.+)$/gm)];source.focus();source.setSelectionRange(matches[i].index,matches[i].index+matches[i][0].length)}else h.scrollIntoView({behavior:'smooth',block:'start'})};nav.appendChild(b)})}
function setMode(next){if(mode==='source'){md=source.value;render()}mode=next;source.style.display=mode==='source'?'block':'none';editor.style.display=mode==='source'?'none':'block';const paperHead=$('paperHead'),toolbar=$('toolbar'),paperLabel=$('paperLabel');if(paperHead)paperHead.style.display=mode==='source'?'none':'flex';editor.contentEditable=mode==='visual'?'true':'false';if(toolbar)toolbar.style.display=mode==='visual'?'flex':'none';if(paperLabel)paperLabel.textContent=mode==='read'?'阅读模式':'可视化编辑 · 点击文字开始写作';source.value=md;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-selected',b.dataset.mode===mode)});updateMeta()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));editor.addEventListener('input',sync);editor.addEventListener('change',()=>{if(mode==='visual')sync();else render()});source.addEventListener('input',()=>{md=source.value;changed()});editor.addEventListener('click',e=>{if(e.target.closest('a')&&mode==='visual')e.preventDefault()});
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&editor.contains(s.anchorNode))range=s.getRangeAt(0).cloneRange()});function restore(){editor.focus();if(range&&editor.contains(range.commonAncestorContainer)){const s=getSelection();s.removeAllRanges();s.addRange(range)}}function cmd(name,value=null){restore();document.execCommand(name,false,value);sync()}
document.querySelectorAll('.toolbar button').forEach(b=>b.onmousedown=e=>e.preventDefault());document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));$('block').onchange=e=>cmd('formatBlock',e.target.value);function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>{const type=b.dataset.insert;const selected=getSelection().toString();if(type==='link'||type==='image'){insertType=type;$('dialogTitle').textContent=type==='image'?'插入图片':'插入链接';$('label').value=selected;$('url').value='';$('dialog').showModal();return}const html={inline:'<code>'+esc(selected||'代码')+'</code> ',task:'<ul><li><input type="checkbox" contenteditable="false"> 待办事项</li></ul><p><br></p>',quote:'<blockquote><p>'+esc(selected||'写下引用内容')+'</p></blockquote><p><br></p>',table:'<table><thead><tr><th>标题一</th><th>标题二</th></tr></thead><tbody><tr><td>内容</td><td>内容</td></tr><tr><td>内容</td><td>内容</td></tr></tbody></table><p><br></p>',code:'<pre><code>'+esc(selected||'在这里输入代码')+'</code></pre><p><br></p>',hr:'<hr><p><br></p>'};cmd('insertHTML',html[type])});$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();const url=$('url').value;if(!safeURL(url,insertType==='image'))return toast('请使用 http 或 https 链接');const label=$('label').value||url;$('dialog').close();cmd('insertHTML',insertType==='image'?'<img src="'+esc(url)+'" alt="'+esc(label)+'">':'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>')};
editor.addEventListener('paste',e=>{e.preventDefault();cmd('insertText',e.clipboardData.getData('text/plain'))});editor.addEventListener('drop',e=>e.preventDefault());$('open').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){toast('请选择小于 5 MB 的文本文件');e.target.value='';return}if(!confirm('打开文件将替换当前草稿。需要保留当前内容时，请先取消并导出。')){e.target.value='';return}try{md=await f.text();filename=f.name;source.value=md;range=null;render();changed();toast('已打开 '+filename)}catch{toast('无法读取文件，请重试')}e.target.value=''};
$('export').onclick=()=>{if(mode==='source')md=source.value;const url=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename.replace(/\.(txt|markdown)$/i,'.md');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 Markdown 文件')};$('theme').onclick=()=>document.body.classList.toggle('dark');$('focus').onclick=()=>document.body.classList.toggle('focus');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();$('export').click()}});try{const saved=JSON.parse(localStorage.getItem('moye-draft'));if(saved&&typeof saved.md==='string'){md=saved.md;filename=saved.filename||filename}}catch{}source.value=md;render();
</script></body></html>
